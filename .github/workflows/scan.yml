name: Refresh market scan
on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 1-3 * * 1-5"
    - cron: "*/10 5-7 * * 1-5"
permissions:
  contents: write
concurrency:
  group: market-scan
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests baostock
      - name: Scan A shares
        run: python scanner.py
      - name: Commit latest data
        run: |
          git config user.name "market-scan-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "chore: refresh market scan"
          git push
