<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>短线狙击工作台 V1 · 单文件版</title>
<style>
:root{--bg:#0b0d10;--card:#14171c;--card2:#191d23;--line:#292f38;--text:#f4f6f8;--muted:#8e97a3;--g:#4bd483;--y:#f1b84b;--r:#ef6a67;--b:#7aa2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1400px;margin:auto;padding:24px}.top{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{margin:0;font-size:24px}.sub{color:var(--muted);font-size:12px;margin-top:5px}.btn{border:1px solid var(--line);background:#20252c;color:#fff;padding:10px 14px;border-radius:9px;cursor:pointer}
.btn.primary{background:#2c5cff;border-color:#2c5cff}.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.panel{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:16px}
.panel h2{font-size:15px;margin:0 0 12px}.cards{display:grid;gap:10px}.stock{display:grid;grid-template-columns:1.2fr .55fr .9fr .8fr;gap:12px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:14px}
.name{font-size:16px;font-weight:700}.code,.muted{color:var(--muted);font-size:12px}.score{font-size:28px;font-weight:800}.good{color:var(--g)}.warn{color:var(--y)}.bad{color:var(--r)}
.tag{display:inline-block;padding:4px 8px;border-radius:7px;font-weight:700;background:#20372a;color:var(--g)}.tag.wait{background:#3c321f;color:var(--y)}.tag.no{background:#3a2224;color:var(--r)}
.kv{color:var(--muted);font-size:12px;line-height:1.8}.kv b{color:var(--text)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:13px;background:var(--card2);border:1px solid var(--line);border-radius:10px}.metric .big{font-size:24px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}
.settings{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}label{font-size:11px;color:var(--muted)}input{width:100%;margin-top:4px;background:#101318;border:1px solid var(--line);border-radius:7px;padding:8px;color:#fff}
.status{margin:10px 0;color:var(--muted);font-size:12px}.bar{height:5px;background:#242932;border-radius:9px;overflow:hidden}.fill{height:100%;background:var(--b);width:0}
.note{color:var(--muted);font-size:11px;margin-top:12px}.empty{padding:30px;text-align:center;color:var(--muted);background:var(--card2);border-radius:10px}
@media(max-width:900px){.grid,.metrics{grid-template-columns:1fr}.settings{grid-template-columns:1fr 1fr}.stock{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
 <div class="top">
  <div><h1>🎯 短线狙击工作台 V1</h1><div class="sub">1～5个交易日｜少做、快出｜公开行情版（非 Level-2）</div></div>
  <button class="btn primary" onclick="scan()">扫描全A股</button>
 </div>

 <div class="panel" style="margin-bottom:14px">
  <h2>筛选条件</h2>
  <div class="settings">
   <label>最低股价<input id="minP" type="number" value="5"></label>
   <label>最高股价<input id="maxP" type="number" value="30"></label>
   <label>最低成交额(亿)<input id="minAmt" type="number" value="5"></label>
   <label>最低换手率%<input id="minTurn" type="number" value="1"></label>
   <label>最大当日涨幅%<input id="maxPct" type="number" value="5"></label>
  </div>
  <div class="status" id="status">点击“扫描全A股”开始。</div>
  <div class="bar"><div id="fill" class="fill"></div></div>
 </div>

 <div class="grid">
  <section class="panel">
   <h2>今日机会（最多3只）</h2>
   <div id="cards" class="cards"><div class="empty">尚未扫描</div></div>
   <div class="note">“主力净流入”是数据商按成交规模计算的指标，并不等于交易所确认的机构买卖身份。</div>
  </section>
  <section class="panel">
   <h2>市场环境</h2>
   <div class="metrics">
    <div class="metric"><div id="mScore" class="big">—</div><div class="muted">环境分</div></div>
    <div class="metric"><div id="mUp" class="big">—</div><div class="muted">上涨占比</div></div>
    <div class="metric"><div id="mMed" class="big">—</div><div class="muted">涨跌中位</div></div>
   </div>
   <h2 style="margin-top:18px">候选池</h2>
   <div style="max-height:530px;overflow:auto"><table><thead><tr><th>股票</th><th>分</th><th>涨跌</th><th>主力净额</th></tr></thead><tbody id="tbody"></tbody></table></div>
  </section>
 </div>
</div>

<script>
function jsonp(url, timeout=12000){
 return new Promise((resolve,reject)=>{
   const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
   const s=document.createElement('script'); let done=false;
   window[cb]=(d)=>{done=true;cleanup();resolve(d)};
   const cleanup=()=>{try{delete window[cb]}catch(e){};s.remove()};
   s.onerror=()=>{cleanup();reject(new Error('数据接口访问失败'))};
   s.src=url+(url.includes('?')?'&':'?')+'cb='+cb;
   document.head.appendChild(s);
   setTimeout(()=>{if(!done){cleanup();reject(new Error('数据接口超时'))}},timeout);
 });
}
const num=x=>{x=Number(x);return Number.isFinite(x)?x:null};
const fmtYi=x=> x==null?'—':(x/1e8).toFixed(2)+'亿';
const marketId=code=>code.startsWith('6')?'1':'0';
function allowed(code,name){
 return !/^(688|300|301|8|4)/.test(code) && !/ST|退/.test(name||'');
}
async function getSpot(){
 const fields='f2,f3,f6,f8,f10,f12,f14,f15,f16,f17,f18,f62,f184';
 const fs=encodeURIComponent('m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23');
 const u=`https://push2.eastmoney.com/api/qt/clist/get?pn=1&pz=6000&po=1&np=1&fltt=2&invt=2&fid=f3&fs=${fs}&fields=${fields}`;
 const j=await jsonp(u); return j?.data?.diff||[];
}
async function getKline(code){
 const secid=marketId(code)+'.'+code;
 const f1='f1,f2,f3,f4,f5,f6', f2='f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61';
 const u=`https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${secid}&klt=101&fqt=1&beg=0&end=20500101&lmt=45&fields1=${f1}&fields2=${f2}`;
 const j=await jsonp(u); return (j?.data?.klines||[]).map(x=>{let a=x.split(',');return {d:a[0],o:+a[1],c:+a[2],h:+a[3],l:+a[4],v:+a[5],amt:+a[6],pct:+a[8],turn:+a[10]}})
}
function avg(a){let x=a.filter(Number.isFinite);return x.length?x.reduce((p,c)=>p+c,0)/x.length:null}
function med(a){let x=a.filter(Number.isFinite).sort((a,b)=>a-b);if(!x.length)return 0;let m=Math.floor(x.length/2);return x.length%2?x[m]:(x[m-1]+x[m])/2}
function histScore(h){
 if(h.length<20)return {trend:50,vol:50,pos:50,trigger:null,support:null};
 let c=h.map(x=>x.c), v=h.map(x=>x.v), last=c.at(-1);
 let ma5=avg(c.slice(-5)),ma10=avg(c.slice(-10)),ma20=avg(c.slice(-20));
 let trend=50+(last>ma5?15:-8)+(ma5>ma10?12:-6)+(ma10>ma20?10:-5);
 let vr=v.at(-1)/Math.max(avg(v.slice(-6,-1))||1,1);
 let vol=Math.max(0,Math.min(100,45+(vr-1)*35));
 let hi=Math.max(...c.slice(-20)),lo=Math.min(...c.slice(-20)),p=(last-lo)/Math.max(hi-lo,.0001);
 let pos=Math.max(0,Math.min(100,100-Math.abs(p-.55)*120));
 let trigger=Math.max(...h.slice(-3,-1).map(x=>x.h),ma5),support=Math.min(...h.slice(-5).map(x=>x.l),ma10);
 return {trend:Math.max(0,Math.min(100,trend)),vol,pos,trigger,support}
}
async function scan(){
 const st=document.getElementById('status'),fill=document.getElementById('fill'),cards=document.getElementById('cards');
 try{
  st.textContent='读取A股实时行情…';fill.style.width='8%';cards.innerHTML='<div class="empty">正在扫描…</div>';
  let raw=await getSpot();
  let all=raw.map(x=>({price:num(x.f2),pct:num(x.f3),amt:num(x.f6),turn:num(x.f8),vr:num(x.f10),code:String(x.f12||'').padStart(6,'0'),name:x.f14||'',main:num(x.f62),mainPct:num(x.f184)}))
             .filter(x=>x.price!=null&&x.pct!=null&&allowed(x.code,x.name));
  let pcts=all.map(x=>x.pct), up=100*all.filter(x=>x.pct>0).length/Math.max(all.length,1), md=med(pcts);
  let mscore=Math.max(0,Math.min(100,45+(up-50)*.8+md*5));
  document.getElementById('mScore').textContent=mscore.toFixed(0)+'/100';
  document.getElementById('mUp').textContent=up.toFixed(1)+'%';
  document.getElementById('mMed').textContent=(md>=0?'+':'')+md.toFixed(2)+'%';

  const minP=+minPEl().value,maxP=+maxPEl().value,minAmt=+document.getElementById('minAmt').value*1e8,minTurn=+document.getElementById('minTurn').value,maxPct=+document.getElementById('maxPct').value;
  let pre=all.filter(x=>x.price>=minP&&x.price<=maxP&&x.amt>=minAmt&&x.turn>=minTurn&&x.pct<=maxPct&&x.pct>=-7.5);
  // 现货预评分：流动性、换手、量比、主力净流入、防追高
  pre.forEach(x=>{
    let liq=Math.min(100,35+Math.log10(Math.max(x.amt/1e8,1))*22+Math.min(x.turn,12)*2.3);
    let flow=50+(x.main>0?18:-10)+Math.max(-15,Math.min(15,(x.mainPct||0)*2.5));
    let chase=Math.max(0,100-Math.max(x.pct,0)*12);
    let active=Math.max(0,Math.min(100,45+((x.vr||1)-1)*30));
    x.pre=.30*liq+.30*flow+.20*chase+.20*active;
  });
  pre.sort((a,b)=>b.pre-a.pre); pre=pre.slice(0,30);
  st.textContent=`预筛 ${pre.length} 只，读取K线确认…`;fill.style.width='20%';
  for(let i=0;i<pre.length;i++){
    let x=pre[i];
    try{
      let h=await getKline(x.code), hs=histScore(h);
      let flow=Math.max(0,Math.min(100,50+(x.main>0?18:-10)+Math.max(-15,Math.min(15,(x.mainPct||0)*2.5))));
      let liq=Math.min(100,35+Math.log10(Math.max(x.amt/1e8,1))*22+Math.min(x.turn,12)*2.3);
      let chase=Math.max(0,100-Math.max(x.pct,0)*12);
      x.score=.28*flow+.22*hs.trend+.15*hs.vol+.15*hs.pos+.10*liq+.10*chase;
      x.trigger=Math.min(Math.max(hs.trigger||x.price,x.price*.998),x.price*1.035);
      x.stop=Math.min(x.trigger*.975,hs.support||x.trigger*.975);
      x.t1=x.trigger*1.03;x.t2=x.trigger*1.05;
      x.status=x.score>=82&&x.price>=x.trigger*.995?'可买触发':(x.score>=72?'重点观察':'放弃');
    }catch(e){x.score=x.pre*.85;x.trigger=x.price*1.01;x.stop=x.price*.975;x.t1=x.price*1.04;x.t2=x.price*1.06;x.status=x.score>=72?'重点观察':'放弃'}
    fill.style.width=(20+75*(i+1)/pre.length)+'%';
    st.textContent=`深度分析 ${i+1}/${pre.length}：${x.name}`;
  }
  pre.sort((a,b)=>b.score-a.score);
  render(pre);fill.style.width='100%';st.textContent=`完成：从全A股筛出 ${pre.length} 只候选，首页展示最多3只。`;
 }catch(e){
  fill.style.width='0';st.textContent='读取失败：'+e.message+'。若公司网络拦截东方财富接口，请换普通网络后再试。';cards.innerHTML='<div class="empty">数据读取失败</div>';
 }
}
function minPSection(){return document.getElementById('minP')}
function minPEl(){return document.getElementById('minP')}
function maxPEl(){return document.getElementById('maxP')}
function render(pre){
 let top=pre.filter(x=>x.status!=='放弃').slice(0,3),cards=document.getElementById('cards');
 if(!top.length){cards.innerHTML='<div class="empty">今天没有达到阈值的机会：建议空仓/等待。</div>'}
 else cards.innerHTML=top.map(x=>{
  let sc=x.score>=82?'good':x.score>=72?'warn':'bad', tag=x.status==='可买触发'?'tag':'tag wait';
  return `<div class="stock">
    <div><div class="name">${x.name}</div><div class="code">${x.code} ｜ 现价 ${x.price.toFixed(2)} ｜ ${x.pct>=0?'+':''}${x.pct.toFixed(2)}%</div></div>
    <div><div class="score ${sc}">${x.score.toFixed(0)}</div><div class="muted">综合分</div></div>
    <div class="kv">触发 <b>${x.trigger.toFixed(2)}</b><br>止损 <b>${x.stop.toFixed(2)}</b><br>目标 <b>${x.t1.toFixed(2)} / ${x.t2.toFixed(2)}</b></div>
    <div><span class="${tag}">${x.status}</span><div class="kv" style="margin-top:7px">主力净额 <b class="${x.main>=0?'good':'bad'}">${fmtYi(x.main)}</b></div></div>
   </div>`}).join('');
 document.getElementById('tbody').innerHTML=pre.slice(0,20).map(x=>`<tr><td>${x.name}<br><span class="muted">${x.code}</span></td><td>${x.score.toFixed(0)}</td><td class="${x.pct>=0?'good':'bad'}">${x.pct>=0?'+':''}${x.pct.toFixed(2)}%</td><td class="${x.main>=0?'good':'bad'}">${fmtYi(x.main)}</td></tr>`).join('');
}
</script>
</body></html>
