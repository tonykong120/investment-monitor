<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>短线狙击工作台 V1.1</title>
<style>
:root{--bg:#0b0d10;--card:#14171c;--card2:#191d23;--line:#292f38;--text:#f4f6f8;--muted:#8e97a3;--g:#4bd483;--y:#f1b84b;--r:#ef6a67;--b:#7aa2ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1400px;margin:auto;padding:24px}.top{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{margin:0;font-size:24px}.sub,.muted{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#2c5cff;color:#fff;padding:10px 14px;border-radius:9px;cursor:pointer}
.grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.panel{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:16px}.panel h2{font-size:15px;margin:0 0 12px}
.cards{display:grid;gap:10px}.stock{display:grid;grid-template-columns:1.2fr .55fr .9fr .8fr;gap:12px;align-items:center;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:14px}
.name{font-size:16px;font-weight:700}.score{font-size:28px;font-weight:800}.good{color:var(--g)}.warn{color:var(--y)}.bad{color:var(--r)}
.tag{display:inline-block;padding:4px 8px;border-radius:7px;font-weight:700;background:#20372a;color:var(--g)}.tag.wait{background:#3c321f;color:var(--y)}
.kv{color:var(--muted);font-size:12px;line-height:1.8}.kv b{color:var(--text)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{padding:13px;background:var(--card2);border:1px solid var(--line);border-radius:10px}.metric .big{font-size:24px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}
.banner{margin-bottom:14px;padding:12px 14px;border:1px solid var(--line);background:var(--card);border-radius:10px}.empty{padding:30px;text-align:center;color:var(--muted);background:var(--card2);border-radius:10px}
@media(max-width:900px){.grid,.metrics{grid-template-columns:1fr}.stock{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div class="wrap">
<div class="top"><div><h1>🎯 短线狙击工作台 V1.1</h1><div class="sub">后台每10分钟扫描｜1～5个交易日｜非 Level-2</div></div><button class="btn" onclick="loadData()">刷新最新结果</button></div>
<div class="banner" id="status">正在读取最新扫描结果…</div>
<div class="grid">
<section class="panel"><h2>今日机会（最多3只）</h2><div id="cards" class="cards"><div class="empty">读取中…</div></div><div class="muted" style="margin-top:12px">注意：评分是筛选排序，不代表胜率；“主力资金”是数据商算法口径。</div></section>
<section class="panel"><h2>市场环境</h2><div class="metrics">
<div class="metric"><div id="mScore" class="big">—</div><div class="muted">环境分</div></div>
<div class="metric"><div id="mUp" class="big">—</div><div class="muted">上涨占比</div></div>
<div class="metric"><div id="mMed" class="big">—</div><div class="muted">涨跌中位</div></div>
</div><h2 style="margin-top:18px">候选池</h2><div style="max-height:520px;overflow:auto"><table><thead><tr><th>股票</th><th>分</th><th>涨跌</th><th>主力净额</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
</div></div>
<script>
async function loadData(){
 const status=document.getElementById('status');
 status.textContent='正在读取最新扫描结果…';
 try{
  const r=await fetch('./data/latest.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('latest.json 还没生成');
  const d=await r.json();
  status.innerHTML=`最新扫描：<b>${d.updated_at}</b>　｜　股票池 ${d.market.universe} 只　｜　后台约每10分钟更新`;
  document.getElementById('mScore').textContent=d.market.score+'/100';
  document.getElementById('mUp').textContent=d.market.up_ratio+'%';
  document.getElementById('mMed').textContent=(d.market.median_pct>=0?'+':'')+d.market.median_pct+'%';
  const cards=document.getElementById('cards');
  if(!d.opportunities.length) cards.innerHTML='<div class="empty">当前没有达到阈值的机会：建议空仓 / 等待。</div>';
  else cards.innerHTML=d.opportunities.map(x=>{
   const sc=x.score>=82?'good':'warn', tag=x.status==='可买触发'?'tag':'tag wait';
   return `<div class="stock"><div><div class="name">${x.name}</div><div class="muted">${x.code} ｜ 现价 ${x.price} ｜ ${x.pct>=0?'+':''}${x.pct}%</div></div>
   <div><div class="score ${sc}">${x.score}</div><div class="muted">综合分</div></div>
   <div class="kv">触发 <b>${x.trigger}</b><br>止损 <b>${x.stop}</b><br>目标 <b>${x.target1} / ${x.target2}</b></div>
   <div><span class="${tag}">${x.status}</span><div class="kv" style="margin-top:7px">主力净额 <b class="${x.main_yi>=0?'good':'bad'}">${x.main_yi}亿</b></div></div></div>`;
  }).join('');
  document.getElementById('tbody').innerHTML=d.candidates.map(x=>`<tr><td>${x.name}<br><span class="muted">${x.code}</span></td><td>${x.score}</td><td class="${x.pct>=0?'good':'bad'}">${x.pct>=0?'+':''}${x.pct}%</td><td class="${x.main_yi>=0?'good':'bad'}">${x.main_yi}亿</td></tr>`).join('');
 }catch(e){
  status.innerHTML='⚠️ 还没有后台扫描数据。先到 GitHub 的 <b>Actions → Refresh market scan → Run workflow</b> 手动运行一次。';
  document.getElementById('cards').innerHTML='<div class="empty">等待第一次后台扫描</div>';
 }
}
loadData();
</script></body></html>
