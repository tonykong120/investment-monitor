<!doctype html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>短线机会工作台 V1.3</title>
<style>
:root{--bg:#0b0d10;--card:#14171c;--card2:#1a1e24;--line:#292f38;--txt:#f2f4f7;--mut:#9098a4;--g:#49d17d;--y:#efb64a;--r:#ef6965;--b:#79a1ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.55 system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1440px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:15px}
h1{font-size:23px;margin:0}.sub,.mut{font-size:12px;color:var(--mut)}button{background:#2e5cff;color:white;border:0;border-radius:8px;padding:9px 13px;cursor:pointer}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px}.panel h2{font-size:14px;margin:0 0 11px}
.banner{margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}.grid{display:grid;grid-template-columns:1.35fr .65fr;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.metric{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:11px}.big{font-size:22px;font-weight:800}
.cards{display:grid;gap:9px}.stock{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:13px}.stockrow{display:grid;grid-template-columns:1.1fr .45fr 1fr .9fr;gap:12px;align-items:center}
.name{font-size:16px;font-weight:750}.score{font-size:27px;font-weight:850}.good{color:var(--g)}.warn{color:var(--y)}.bad{color:var(--r)}
.tag{display:inline-block;border-radius:6px;padding:3px 7px;background:#20372a;color:var(--g);font-weight:700;font-size:12px}.tag.wait{background:#3a311e;color:var(--y)}
.kv{font-size:12px;color:var(--mut);line-height:1.75}.kv b{color:var(--txt)}.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.chip{padding:3px 7px;border-radius:999px;background:#202a23;color:#9de0b5;font-size:11px}.chip.w{background:#352a20;color:#efc17b}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}
.health{display:flex;gap:7px;flex-wrap:wrap}.health span{font-size:11px;padding:4px 7px;border-radius:999px;background:#20252c}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;background:var(--g)}.dot.off{background:var(--r)}
.empty{background:var(--card2);padding:25px;border-radius:9px;text-align:center;color:var(--mut)}details{margin-top:10px}summary{cursor:pointer;color:var(--mut);font-size:12px}
input{background:#111419;color:white;border:1px solid var(--line);border-radius:7px;padding:7px;width:100%}.journal{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:7px}
@media(max-width:900px){.grid,.grid2{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}.stockrow{grid-template-columns:1fr 1fr}.top,.banner{align-items:flex-start;flex-direction:column}.journal{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap">
<div class="top"><div><h1>🎯 短线机会工作台 V1.3</h1><div class="sub">1～5个交易日｜只做 0～3 个机会｜免费多数据源</div></div><button onclick="loadData()">刷新最新结果</button></div>
<div class="panel banner"><div id="status">读取最新扫描结果…</div><div id="health" class="health"></div></div>
<div class="grid">
<section class="panel"><h2>今日机会</h2><div id="opps" class="cards"><div class="empty">读取中…</div></div></section>
<section class="panel"><h2>市场状态</h2><div class="metrics">
<div class="metric"><div id="mScore" class="big">—</div><div class="mut">环境分</div></div>
<div class="metric"><div id="mState" class="big">—</div><div class="mut">状态</div></div>
<div class="metric"><div id="mUp" class="big">—</div><div class="mut">上涨占比</div></div>
<div class="metric"><div id="mMed" class="big">—</div><div class="mut">涨跌中位</div></div>
</div><h2 style="margin-top:15px">自选监控</h2><div id="watch" class="cards"></div></section>
</div>
<div class="grid2">
<section class="panel"><h2>候选池 TOP20</h2><div style="max-height:490px;overflow:auto"><table><thead><tr><th>股票</th><th>分</th><th>涨跌</th><th>量比</th><th>状态</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
<section class="panel"><h2>交易记录（只存在当前浏览器）</h2>
<div class="journal"><input id="jcode" placeholder="代码"><input id="jbuy" placeholder="买入价"><input id="jnote" placeholder="备注"><button onclick="addJournal()">记录</button></div>
<div id="journalList" style="margin-top:10px"></div>
<details><summary>说明</summary><div class="mut">交易记录使用浏览器 localStorage，不会上传到 GitHub。评分是筛选排序，不等于胜率。资金流接口不可用时显示“未接入”，不会伪造为 0。</div></details>
</section></div>
</div>
<script>
const money=x=>x===null||x===undefined?'未接入':`${x>=0?'+':''}${x}亿`;
function stockCard(x,compact=false){
 const sc=x.score>=80?'good':(x.score>=70?'warn':'bad'); const tc=x.status==='可买触发'?'tag':'tag wait'; const f=x.fund_flow||{};
 let chips=(x.reasons||[]).map(s=>`<span class="chip">${s}</span>`).join('')+(x.warnings||[]).map(s=>`<span class="chip w">${s}</span>`).join('');
 return `<div class="stock"><div class="stockrow">
 <div><div class="name">${x.name}</div><div class="mut">${x.code} ｜ ${x.price} ｜ <span class="${x.pct>=0?'good':'bad'}">${x.pct>=0?'+':''}${x.pct}%</span></div></div>
 <div><div class="score ${sc}">${x.score}</div><div class="mut">综合分</div></div>
 <div class="kv">触发 <b>${x.trigger}</b>　止损 <b>${x.stop}</b><br>目标 <b>${x.target1} / ${x.target2}</b>　盈亏比 <b>${x.rr1}</b></div>
 <div><span class="${tc}">${x.status}</span><div class="kv" style="margin-top:5px">成交额 <b>${x.amount_yi}亿</b><br>资金 <b>${f.available?money(f.main_yi):'未接入'}</b></div></div>
 </div>${compact?'':`<div class="chips">${chips||'<span class="mut">暂无额外信号</span>'}</div>`}</div>`;
}
async function loadData(){
 try{
  const r=await fetch('./data/latest.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw Error('数据文件未生成'); const d=await r.json();
  status.innerHTML=`V${d.version||'—'}　最新扫描 <b>${d.updated_at}</b>　｜　股票池 ${d.market.universe} 只`;
  mScore.textContent=d.market.score+'/100';mState.textContent=d.market.state||'—';mUp.textContent=d.market.up_ratio+'%';mMed.textContent=(d.market.median_pct>=0?'+':'')+d.market.median_pct+'%';
  const h=d.source_health||{}; health.innerHTML=Object.values(h).map(x=>`<span><i class="dot ${x.ok?'':'off'}"></i>${x.role}</span>`).join('');
  opps.innerHTML=(d.opportunities||[]).length?d.opportunities.map(x=>stockCard(x)).join(''):'<div class="empty">没有达到阈值的机会。今天可以不做。</div>';
  watch.innerHTML=(d.watchlist||[]).map(x=>stockCard(x,true)).join('')||'<div class="empty">暂无自选数据</div>';
  tbody.innerHTML=(d.candidates||[]).map(x=>`<tr><td><b>${x.name}</b><br><span class="mut">${x.code}</span></td><td>${x.score}</td><td class="${x.pct>=0?'good':'bad'}">${x.pct>=0?'+':''}${x.pct}%</td><td>${x.volume_ratio}</td><td>${x.status}</td></tr>`).join('');
 }catch(e){status.textContent='⚠️ '+e.message;opps.innerHTML='<div class="empty">等待后台扫描数据</div>'}
}
function loadJournal(){let a=JSON.parse(localStorage.getItem('tradeJournal')||'[]');journalList.innerHTML=a.length?a.map((x,i)=>`<div class="stock"><b>${x.code}</b>　买入 ${x.buy}　<span class="mut">${x.note||''}　${x.time}</span> <button style="float:right;padding:3px 7px;background:#343941" onclick="delJournal(${i})">删</button></div>`).join(''):'<div class="empty">暂无记录</div>'}
function addJournal(){let a=JSON.parse(localStorage.getItem('tradeJournal')||'[]');a.unshift({code:jcode.value,buy:jbuy.value,note:jnote.value,time:new Date().toLocaleString()});localStorage.setItem('tradeJournal',JSON.stringify(a));jcode.value=jbuy.value=jnote.value='';loadJournal()}
function delJournal(i){let a=JSON.parse(localStorage.getItem('tradeJournal')||'[]');a.splice(i,1);localStorage.setItem('tradeJournal',JSON.stringify(a));loadJournal()}
loadData();loadJournal();
</script></body></html>
